[project]
name = "kaggler"
version = "0.1.0"
description = "Automated Kaggle competition bot using Claude API and AutoGluon"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "kaggle>=1.6.17",
    "autogluon.tabular>=1.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
]

[project.scripts]
kaggler = "main:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaggler"]
